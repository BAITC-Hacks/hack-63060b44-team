[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "hackalem-windforecast"
version = "0.1.0"
description = "Auditable point-in-time hourly forecasts for two wind turbines"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "requests>=2.32,<3", "tzdata>=2025.1", "eccodes>=2.40,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.scripts]
windforecast = "windforecast.cli:main"

[tool.setuptools.packages.find]
include = ["windforecast*", "windpulse_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
